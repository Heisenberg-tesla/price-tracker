name: Backup Scheduled Scraper (Redundant Trigger)

# ==============================================================================
# ARCHITECTURAL NOTICE — REDUNDANT BACKUP ONLY (NEVER PRIMARY):
#
# Primary Scheduler (System of Record):
#   cron-job.org  →  POST /api/cron/scrape-due  →  Render Backend
#
# This GitHub Actions workflow is strictly a SECONDARY, REDUNDANT SAFETY NET
# whose sole purpose is to prevent missed scrapes if cron-job.org experiences
# downtime or network partitions.
#
# WHY GITHUB ACTIONS IS NOT THE PRIMARY SCHEDULER:
# 1. Best-Effort Scheduling: GitHub Actions scheduled workflows are queued on
#    shared infrastructure. High platform load can delay execution by 15-60+
#    minutes, violating deterministic scraping cadence guarantees.
# 2. Inactivity Disablement: GitHub automatically disables cron workflows on
#    repositories with no commit activity for 60 consecutive days.
# 3. Dedicated Precision: cron-job.org guarantees millisecond-accurate dispatch,
#    detailed failure webhooks, and predictable execution intervals.
#
# REQUIRED REPOSITORY SECRETS (Settings → Secrets → Actions):
#   RENDER_BACKEND_URL   — e.g. https://price-tracker-backend.onrender.com
#   CRON_SECRET          — Must match the CRON_SECRET set on Render (same value)
# ==============================================================================

on:
  schedule:
    # Runs every 2 hours at minute 30 (offset by 30 min from cron-job.org's :00
    # trigger to ensure the backup never fires simultaneously with the primary)
    - cron: '30 */2 * * *'
  # Allows manual triggering for operator testing and emergency sweeps
  workflow_dispatch:

jobs:
  backup-scrape-trigger:
    name: Trigger Scrape-Due Endpoint (Backup)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required secrets are present
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "::error::RENDER_BACKEND_URL repository secret is missing."
            echo "::error::Go to Settings → Secrets → Actions and add RENDER_BACKEND_URL."
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET repository secret is missing."
            echo "::error::Go to Settings → Secrets → Actions and add CRON_SECRET."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Trigger Render Backend Scrape-Due
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "================================================================="
          echo "Triggering backup scrape-due endpoint at: $BACKEND_URL"
          echo "Trigger source: github-actions (backup scheduler)"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "================================================================="

          # Fire POST request with X-Cron-Secret auth and X-Trigger-Source header.
          # --connect-timeout 60s accounts for Render free-tier cold starts.
          # --max-time 300s allows Playwright scraping cycles to complete.
          RESPONSE=$(curl -s -S -w "\n%{http_code}" \
            -X POST "$BACKEND_URL/api/cron/scrape-due" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "X-Trigger-Source: github-actions" \
            -H "Content-Type: application/json" \
            --connect-timeout 60 \
            --max-time 300)

          # Extract HTTP status code and response body
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Backup scrape trigger completed successfully."
          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "Scrape already running (HTTP 409) — no action needed. Primary scheduler handled it."
          else
            echo "::error::Backup scrape trigger failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
